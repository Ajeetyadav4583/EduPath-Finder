{% extends "base.html" %}

{% block content %}

<section class="focus-box">

    <h1>
        <i class="fa-solid fa-clock"></i>
        Focus Mode
    </h1>

    <p>
        Stay focused for 25 minutes and complete one learning task.
    </p>

    <div id="timer">
        25:00
    </div>

    <div class="focus-buttons">

        <button onclick="startTimer()">
            Start
        </button>

        <button onclick="pauseTimer()">
            Pause
        </button>

        <button onclick="resetTimer()">
            Reset
        </button>

    </div>

</section>

{% endblock %}
