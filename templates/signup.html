{% extends "base.html" %}

{% block content %}

<h1 style="text-align:center; margin-bottom:20px;">
    Create Account
</h1>

{% if error %}

<p style="
    color:red;
    text-align:center;
    font-weight:600;
    margin-bottom:20px;
">
    {{ error }}
</p>

{% endif %}

<form method="POST" class="form-box">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Sign Up
    </button>

</form>

{% endblock %}
