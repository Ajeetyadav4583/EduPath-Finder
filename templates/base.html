<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPath Finder</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="scroll-progress"><span id="scrollProgressBar"></span></div>

<nav class="navbar">
    <a href="/" class="logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>EduPath<br>Finder</span>
    </a>

    <div class="nav-links">
        <a href="/" class="{{ 'active' if request.path == '/' }}"><i class="fa-solid fa-house"></i> Home</a>
        <a href="/courses" class="{{ 'active' if request.path == '/courses' }}"><i class="fa-solid fa-book-open"></i> Courses</a>
        <a href="/books" class="{{ 'active' if request.path == '/books' }}"><i class="fa-solid fa-book"></i> Books</a>
        <a href="/tools" class="{{ 'active' if request.path == '/tools' }}"><i class="fa-solid fa-screwdriver-wrench"></i> Tools</a>
        <a href="/roadmap" class="{{ 'active' if request.path == '/roadmap' }}"><i class="fa-solid fa-route"></i> AI Roadmap</a>
        <a href="/focus" class="{{ 'active' if request.path == '/focus' }}"><i class="fa-solid fa-clock"></i> Focus</a>
        <a href="/notes" class="{{ 'active' if request.path == '/notes' }}"><i class="fa-solid fa-note-sticky"></i> Notes</a>
        <a href="/contact" class="{{ 'active' if request.path == '/contact' }}"><i class="fa-solid fa-envelope"></i> Contact</a>

        {% if session.username %}
            <span class="user-pill">👋 {{ session.username }}</span>
            <a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        {% else %}
            <a href="/signup"><i class="fa-solid fa-user-plus"></i> Signup</a>
            <a href="/login"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        {% endif %}
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    © 2026 EduPath Finder | Built by Ajeet Yadav
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
